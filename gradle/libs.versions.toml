[versions]
springBoot = "4.0.3"
springDependencyManagement = "1.1.7"
archunit = "1.4.1"
jspecify = "1.0.0"
junit = "6.0.0"
assertj = "3.27.3"
jqwik = "1.9.3"
jacoco = "0.8.13"
jmh = "1.37"
jmhGradlePlugin = "0.7.2"
pdfbox = "3.0.8"
djlTokenizers = "0.36.0"
onnxruntime = "1.29.0"
springAi = "2.0.0"
wiremock = "3.10.0"

[libraries]
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter", version.ref = "springBoot" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator", version.ref = "springBoot" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "springBoot" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "springBoot" }
# Spring Boot 4.0.3 moved @WebMvcTest/@AutoConfigureMockMvc out of spring-boot-test-autoconfigure
# into this dedicated module (package org.springframework.boot.webmvc.test.autoconfigure);
# spring-boot-starter-test no longer pulls it in transitively.
spring-boot-webmvc-test = { module = "org.springframework.boot:spring-boot-webmvc-test", version.ref = "springBoot" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
# No version.ref: managed by the Spring Boot BOM infrastructure/build.gradle.kts already
# imports (TRD §5.1, "Gestionado por BOM"; task A5 of the rest-api feature, TRD §9's
# "Caffeine regions" runtime cache).
caffeine = { module = "com.github.ben-manes.caffeine:caffeine" }
djl-tokenizers = { module = "ai.djl.huggingface:tokenizers", version.ref = "djlTokenizers" }
onnxruntime = { module = "com.microsoft.onnxruntime:onnxruntime", version.ref = "onnxruntime" }
spring-ai-bom = { module = "org.springframework.ai:spring-ai-bom", version.ref = "springAi" }
spring-ai-openai = { module = "org.springframework.ai:spring-ai-openai" }
wiremock = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
jmh = { id = "me.champeau.jmh", version.ref = "jmhGradlePlugin" }
