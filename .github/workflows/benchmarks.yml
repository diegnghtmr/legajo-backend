name: JMH Benchmarks

# TRD §14.3: "Trabajo de JMH manual o disparado por etiqueta" -- never on every push or pull
# request, unlike backend.yml. Anyone can trigger it by hand from the Actions tab, or by
# pushing a tag matching bench-* (e.g. bench-2026-09-22); the numbers this job produces run on
# a shared GitHub-hosted runner, not the documented reference harness (see the README's
# Benchmarks section).
on:
  workflow_dispatch:
  push:
    tags:
      - "bench-*"

permissions:
  contents: read

jobs:
  jmh:
    runs-on: ubuntu-latest
    # Generous but bounded: a full NFR-QA-10 run (four pairwise curves, four HAC linkages plus
    # two internal metrics, two embedding dimensions, two SLO suites) on a shared runner should
    # never legitimately need this long; it exists to fail a hung run instead of burning
    # Actions minutes indefinitely.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "25"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run the JMH suite (NFR-QA-10's protocol, declared per @Benchmark class)
        run: ./gradlew :benchmarks:jmh

      - name: Export results to CSV and log-log slopes (TAC-18)
        run: ./gradlew :benchmarks:jmhExport

      - name: Upload benchmark results
        # Only on success: the versioned CSVs are the exported, validated numbers this
        # job produced -- never upload them under the same artifact name a failed or partial
        # run could also produce, so nobody mistakes a failed run's leftovers for real results.
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jmh-benchmark-results
          path: benchmarks/results/*.csv
          retention-days: 30

      - name: Upload benchmark diagnostics
        # Under a clearly different artifact name than the results above: a partial
        # jmh-results.json or the harness sidecar alone is still useful evidence for debugging a
        # failed or timed-out run, but it is never the exported, validated CSVs and must never
        # be mistaken for them.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jmh-benchmark-diagnostics
          path: |
            benchmarks/build/results/jmh/jmh-results.json
            benchmarks/build/results/jmh/harness.properties
          if-no-files-found: ignore
          retention-days: 30
