name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Runs the exact same containerized path a developer uses locally
      # (scripts/gradle-in-docker.sh, README "Verification runs in containers") instead of a
      # separate actions/setup-java host JDK — the documented developer path is what this CI
      # now exercises, not a parallel one that could drift from it. No `</dev/null` redirect
      # on the steps below: the script's own `docker run` never passes `-t`/`-i`, so the
      # container gets no stdin regardless of what the runner's shell has, and a GitHub-hosted
      # runner already runs each step's script non-interactively with no stdin of its own —
      # redirecting an already-empty stdin to /dev/null changes nothing observable here, so it
      # is left out rather than kept as a comment describing an effect the command does not
      # have. The script resolves the invoking uid/gid itself (`$(id -u):$(id -g)`, its own
      # comments) and reuses one named Docker volume for GRADLE_USER_HOME across both steps
      # below, so the dependency/build cache the first step downloads is not re-fetched by the
      # second.
      - name: Build (compile, test, ArchUnit)
        run: ./scripts/gradle-in-docker.sh build

      - name: Aggregate coverage report
        run: ./scripts/gradle-in-docker.sh jacocoRootReport

  # Image smoke test (health, OpenAPI, corpus listing, a real comparison
  # including needleman-wunsch, and Ward clustering). Runs after `build` rather than in
  # parallel: building and starting the image are comparatively expensive, and there is no
  # point paying for either against code that does not even compile or pass its own tests.
  image-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build the image and start the default-profile stack
        run: docker compose up -d --build --wait backend

      # curl/jq come from the container, never the runner. `alpine:3.20` installs
      # them at run time rather than a custom pre-built image, keeping this job
      # self-contained; the trailing "_" is a dummy $0 for the inline `sh -c` script, so
      # smoke.sh's base-url argument lands in that script's $1 as intended.
      - name: Run the smoke script
        run: |
          docker run --rm --network host \
            -v "$(pwd)/scripts:/scripts:ro" -w /scripts \
            alpine:3.20 sh -c 'apk add --no-cache curl jq >/dev/null && ./smoke.sh "$1"' \
            _ http://localhost:8080

      - name: Dump backend logs on failure
        if: failure()
        run: docker compose logs backend

      - name: Tear down
        if: always()
        run: docker compose down
