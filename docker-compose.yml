# TRD §14.1/§14.2: profiles select which services run. `ingest` is a one-shot, local-only
# extraction step (GROBID) — never part of the `default` demo profile.
#
# The `backend` service below is the `default`-profile demo target, built from this
# repository's own Dockerfile. The `frontend` service is not defined here yet: it depends
# on the frontend repository having its own image (odd/tasks/containers.md, task F1), and on
# this Compose file building it from `${LEGAJO_FRONTEND_DIR:-../frontend}` (task K4, TRD
# §14.2) — a follow-up once that image exists, not a promised date.
services:
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      # TRD §14.1: the default profile needs no live embedding credentials — it serves the
      # versioned caches under data/. LEGAJO_CORS_ORIGINS passes through whatever the host
      # has set (empty by default): unset, the server falls back to its documented defaults
      # (http://localhost:5173, http://localhost); a host value (e.g. a real deployment's
      # public frontend origin) replaces those defaults instead of adding to them.
      LEGAJO_EMBEDDING_PROVIDER: ${LEGAJO_EMBEDDING_PROVIDER:-cached}
      LEGAJO_CORS_ORIGINS: ${LEGAJO_CORS_ORIGINS:-}
    # No healthcheck override here: Compose inherits the image's own HEALTHCHECK
    # (Dockerfile) unless a service redefines one, and duplicating the same bash/dev/tcp
    # probe in two files would only be one more place for the two to drift apart. That
    # inherited healthcheck is what makes `docker compose up --wait` block until the backend
    # actually answers 200/UP on /actuator/health, not just until the process starts.

  grobid:
    image: lfoppiano/grobid:0.8.2
    profiles: ["ingest"]
    ports:
      - "8070:8070"
    environment:
      # Works around a JDK cgroup v2 detection bug (NullPointerException in
      # jdk.internal.platform.cgroupv2.CgroupV2Subsystem) seen on hosts where the
      # container runtime does not expose a full cgroup v2 controller set (e.g. a
      # sandboxed/nested Docker daemon); harmless here since this is a single-purpose,
      # one-shot ingestion container with no other workload sharing its cgroup.
      JAVA_TOOL_OPTIONS: "-XX:-UseContainerSupport"
